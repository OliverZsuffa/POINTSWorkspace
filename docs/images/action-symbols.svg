<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
  <style>
    .cell{fill:#fff;stroke:none}.line{stroke:#263238;stroke-width:4;fill:none;stroke-linecap:square}
    .name{font:600 20px Arial,sans-serif;fill:#263238;text-anchor:middle}
    .target{font:22px Arial,sans-serif;fill:#263238;text-anchor:middle;dominant-baseline:middle}
    .note{font:15px Arial,sans-serif;fill:#526168;text-anchor:middle}
  </style>
  <rect width="900" height="330" fill="#faf9f6"/>
  <g transform="translate(45 42)">
    <g transform="translate(0 0)">
      <path class="line" d="M0 0H100 M0 76H100"/>
      <text class="name" x="50" y="112">HOLD</text>
      <text class="note" x="50" y="136">Continue holding</text>
    </g>
    <g transform="translate(140 0)">
      <path class="line" d="M0 0H100 M0 0V76 M0 76H100"/>
      <text class="target" x="50" y="38">A</text>
      <text class="name" x="50" y="112">LIFT</text>
      <text class="note" x="50" y="136">Take from position</text>
    </g>
    <g transform="translate(280 0)">
      <path class="line" d="M0 0H100 M100 0V76 M0 76H100"/>
      <text class="target" x="50" y="38">A</text>
      <text class="name" x="50" y="112">LEAVE</text>
      <text class="note" x="50" y="136">Place at position</text>
    </g>
    <g transform="translate(420 0)">
      <path class="line" d="M0 0H100 M0 76H100"/>
      <text class="target" x="50" y="38">A</text>
      <text class="name" x="50" y="112">BOUNCE</text>
      <text class="note" x="50" y="136">Tap while holding</text>
    </g>
    <g transform="translate(560 0)">
      <text class="target" x="50" y="38">A</text>
      <text class="name" x="50" y="112">TAP</text>
      <text class="note" x="50" y="136">Tap with empty hand</text>
    </g>
    <g transform="translate(700 0)">
      <text class="name" x="50" y="112">EMPTY</text>
      <text class="note" x="50" y="136">No action</text>
    </g>
  </g>
  <text x="450" y="275" class="note">Target position shown as A where the action requires one.</text>
</svg>