<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230">
  <style>
    .line{stroke:#263238;stroke-width:4;fill:none;stroke-linecap:square}
    .label{font:600 18px Arial,sans-serif;fill:#263238;text-anchor:middle}
    .beat{font:16px Arial,sans-serif;fill:#526168;text-anchor:middle}
    .target{font:20px Arial,sans-serif;fill:#263238;text-anchor:middle;dominant-baseline:middle}
  </style>
  <rect width="820" height="230" fill="#faf9f6"/>
