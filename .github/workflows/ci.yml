name: CI

on:
  push:
    branches:
      - main
      - 'implementation/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply formatting
        run: npm run format

      - name: Check formatting
        run: npm run format:check

      - name: Upload formatted source for review
        uses: actions/upload-artifact@v4
        with:
          name: formatted-foundation-source
          path: |
            src/**
            eslint.config.js
          if-no-files-found: error

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install browser test tooling
        run: npm install --no-save --no-audit --no-fund @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify editor at desktop, tablet and phone viewports
        run: npx playwright test

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 03c-viewport-review
          path: test-results/*.png
          if-no-files-found: ignore
